<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dynamic Theme Switcher</title>
<style>
  /* Light theme variables (default) */
  :root {
    --bg-color: #ffffff;
    --text-color: #1a1a1a;
    --button-bg: #1a1a1a;
    --button-text: #ffffff;
    --accent-color: #4f46e5;
  }

  /* Dark theme overrides, applied via data-theme attribute on <body> */
  [data-theme="dark"] {
    --bg-color: #121212;
    --text-color: #f5f5f5;
    --button-bg: #f5f5f5;
    --button-text: #121212;
    --accent-color: #818cf8;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  h1 {
    margin: 0;
    color: var(--accent-color);
  }

  #themeToggleBtn {
    padding: 12px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background-color: var(--button-bg);
    color: var(--button-text);
    transition: background-color 0.3s ease, color 0.3s ease, transform 0.15s ease;
  }

  #themeToggleBtn:hover {
    transform: scale(1.05);
  }
</style>
</head>
<body data-theme="light">
  <h1>Dynamic Theme Switcher</h1>
  <button id="themeToggleBtn">Switch to Dark Mode</button>

  <script>
    // Grab the required DOM elements
    const bodyElement = document.body;
    const toggleButton = document.getElementById("themeToggleBtn");

    /**
     * Toggles the theme between "light" and "dark" by updating the
     * data-theme attribute on <body>. The CSS custom properties defined
     * for each theme automatically restyle the page.
     */
    function toggleTheme() {
      const currentTheme = bodyElement.getAttribute("data-theme");
      const nextTheme = currentTheme === "light" ? "dark" : "light";

      bodyElement.setAttribute("data-theme", nextTheme);
      toggleButton.textContent =
        nextTheme === "light" ? "Switch to Dark Mode" : "Switch to Light Mode";
    }

    toggleButton.addEventListener("click", toggleTheme);
  </script>
</body>
</html>
